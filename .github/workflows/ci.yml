name: CI/CD for CyclicList Project
on:
  push:
    branches: [workBranch]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up GCC and Google Test
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libgtest-dev libgtest-static
    - name: Print compiler version
      run: g++ --version
    - name: Create build and bin directories
      run: |
        mkdir -p build
        mkdir -p bin
    - name: Build project
      run: |
        make test
    - name: Run tests
      run: |
        ./bin/cyclicListTest
